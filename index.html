<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Validación</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; display: none; }
        .excel-table { border-collapse: collapse; width: 100%; background: white; }
        .excel-table th { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 6px; font-size: 0.7rem; color: #475569; }
        .excel-table td { border: 1px solid #cbd5e1; padding: 2px; }
        .input-excel { width: 100%; border: none; outline: none; padding: 6px; text-align: center; font-size: 0.85rem; }
        .input-excel:focus { background: #f1f5f9; border: 1px solid #3b82f6; }
        .header-blue { background: #1e3a8a; color: white; padding: 8px; text-align: center; font-weight: bold; font-size: 0.9rem; }
        .label-dia { background: #f8fafc; font-weight: bold; font-size: 0.75rem; color: #64748b; padding-left: 8px; }
        .resumen-card { background: #ffffff; border: 2px solid #1e3a8a; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body id="mainBody">
    <div class="max-w-md mx-auto space-y-4 p-2 pb-20">
        
        <div class="bg-white shadow rounded-lg overflow-hidden border border-gray-300">
            <div class="header-blue uppercase tracking-wider">Costeo de Productos - Margen</div>
            <table class="excel-table">
                <thead>
                    <tr>
                        <th width="40%">PRODUCTO</th>
                        <th width="30%">COSTO</th>
                        <th width="30%">VENTA</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
            </table>
        </div>

        <div class="bg-white shadow rounded-lg overflow-hidden border border-gray-300">
            <div class="header-blue uppercase tracking-wider text-xs">Ventas Diarias (7 Días)</div>
            <table class="excel-table">
                <tbody>
                    <tr><td class="label-dia">Lunes</td><td><input type="number" class="input-excel v-dia" oninput="calcularTodo()"></td></tr>
                    <tr><td class="label-dia">Martes</td><td><input type="number" class="input-excel v-dia" oninput="calcularTodo()"></td></tr>
                    <tr><td class="label-dia">Miércoles</td><td><input type="number" class="input-excel v-dia" oninput="calcularTodo()"></td></tr>
                    <tr><td class="label-dia">Jueves</td><td><input type="number" class="input-excel v-dia" oninput="calcularTodo()"></td></tr>
                    <tr><td class="label-dia">Viernes</td><td><input type="number" class="input-excel v-dia" oninput="calcularTodo()"></td></tr>
                    <tr><td class="label-dia">Sábado</td><td><input type="number" class="input-excel v-dia" oninput="calcularTodo()"></td></tr>
                    <tr><td class="label-dia">Domingo</td><td><input type="number" class="input-excel v-dia" oninput="calcularTodo()"></td></tr>
                </tbody>
            </table>
        </div>

        <div class="resumen-card shadow-lg">
            <div class="header-blue">RESUMEN DE RESULTADOS</div>
            <div class="p-4 space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="text-xs font-bold text-gray-600">DÍAS DEL MES:</span>
                    <input type="number" id="diasMes" value="30" class="w-16 p-1 border rounded text-center font-bold text-blue-700" oninput="calcularTodo()">
                </div>
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="text-xs font-bold text-gray-600">MARGEN PROMEDIO:</span>
                    <span id="resMargen" class="font-bold text-blue-800">0%</span>
                </div>
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="text-xs font-bold text-gray-600">PROMEDIO DIARIO:</span>
                    <span id="resDiario" class="font-bold text-green-700">$0.00</span>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <span class="text-xs font-bold text-gray-800">VENTA MENSUAL:</span>
                    <span id="resMensual" class="text-xl font-black text-green-800">$0.00</span>
                </div>
            </div>
        </div>

        <button onclick="copiarResumen()" class="w-full bg-blue-700 text-white py-4 rounded-lg font-bold shadow-md active:bg-blue-800 transition-colors">
            📋 COPIAR DATOS PARA REPORTE
        </button>
    </div>

    <script>
        // --- SEGURIDAD ---
        const CLAVE_ACCESO = "Validacion2026";
        function validarAcceso() {
            if (localStorage.getItem("acceso_autorizado") !== "true") {
                let pass = prompt("Clave de acceso:");
                if (pass === CLAVE_ACCESO) {
                    localStorage.setItem("acceso_autorizado", "true");
                    document.getElementById('mainBody').style.display = "block";
                } else { alert("Error"); window.location.reload(); }
            } else { document.getElementById('mainBody').style.display = "block"; }
        }
        window.onload = validarAcceso;

        // --- GENERAR TABLA PRODUCTOS ---
        const tablaProd = document.getElementById('tablaProductos');
        for(let i=1; i<=5; i++) {
            tablaProd.innerHTML += `<tr>
                <td class="text-xxs text-gray-400 font-bold px-2 uppercase">Producto ${i}</td>
                <td><input type="number" class="input-excel costo" oninput="calcularTodo()"></td>
                <td><input type="number" class="input-excel venta" oninput="calcularTodo()"></td>
            </tr>`;
        }

        // --- LÓGICA DE CÁLCULO ---
        function calcularTodo() {
            // 1. Margen
            const costos = document.querySelectorAll('.costo');
            const ventas = document.querySelectorAll('.venta');
            let sumaM = 0; let cantM = 0;
            costos.forEach((cInp, i) => {
                const c = parseFloat(cInp.value) || 0;
                const v = parseFloat(ventas[i].value) || 0;
                if(v > 0) { sumaM += (v - c) / v; cantM++; }
            });
            const margenFinal = cantM > 0 ? (sumaM/cantM)*100 : 0;
            document.getElementById('resMargen').innerText = margenFinal.toFixed(2) + "%";

            // 2. Venta Diaria
            const inputsDias = document.querySelectorAll('.v-dia');
            let sumaV = 0; let cantV = 0;
            inputsDias.forEach(input => {
                const val = parseFloat(input.value);
                if(!isNaN(val) && val > 0) { sumaV += val; cantV++; }
            });
            const promDiario = cantV > 0 ? (sumaV / cantV) : 0;
            document.getElementById('resDiario').innerText = "$" + promDiario.toFixed(2);

            // 3. Venta Mensual
            const dias = parseInt(document.getElementById('diasMes').value) || 0;
            const mensual = promDiario * dias;
            document.getElementById('resMensual').innerText = "$" + mensual.toFixed(2);
        }

        function copiarResumen() {
            const m = document.getElementById('resMargen').innerText;
            const d = document.getElementById('resDiario').innerText;
            const mes = document.getElementById('resMensual').innerText;
            const texto = `RESULTADOS DE VALIDACIÓN:\n- Margen Promedio: ${m}\n- Venta Diaria: ${d}\n- Venta Mensual Est: ${mes}`;
            navigator.clipboard.writeText(texto);
            alert("¡Copiado con éxito!");
        }
    </script>
</body>
</html>
